<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Live STT</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main class="launcher">
    <p class="eyebrow">YOUTUBE LIVE STT</p>
    <h1>현재 탭 오디오 캡처</h1>
    <p id="tabTitle" class="tab-title">YouTube 탭 확인 중…</p>

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">로컬 Whisper 준비 중…</span>
    </div>

    <p id="message" class="message">
      Chrome 권한 때문에 새 캡처는 이 팝업에서 시작해야 합니다.
    </p>

    <button id="startBtn" type="button" disabled>준비 중…</button>
    <button id="releaseBtn" class="secondary release hidden" type="button">남아 있는 캡처 강제 해제</button>
    <div class="secondary-grid">
      <button id="openPanelBtn" class="secondary" type="button">Side Panel 열기</button>
      <button id="openWindowBtn" class="secondary" type="button">새 창 열기</button>
    </div>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
