<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay Visual QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:24px; background:#181a20; color:#fff; font-family:Arial,sans-serif; }
    .qa-controls { display:flex; gap:8px; margin-bottom:14px; }
    button { padding:8px 14px; border:0; border-radius:7px; cursor:pointer; }
    #movie_player {
      position:relative; width:min(960px,calc(100vw - 48px)); aspect-ratio:16/9;
      overflow:hidden; background:linear-gradient(135deg,#23354e,#7b8796); box-shadow:0 20px 50px #0008;
    }
    .slide { position:absolute; inset:8% 8% 18%; padding:7%; background:#f6f1e7; color:#1c2633; }
    .slide h1 { margin-top:0; font-size:34px; }
    .slide p { font-size:22px; line-height:1.55; }
    .fake-controls { position:absolute; left:0; right:0; bottom:0; height:12%; background:linear-gradient(transparent,#000d); }
  </style>
</head>
<body>
  <div class="qa-controls">
    <button data-position="top">상단</button>
    <button data-position="center">중앙</button>
    <button data-position="bottom">하단</button>
    <button id="autohideBtn">컨트롤 숨김 전환</button>
  </div>
  <div id="movie_player">
    <div class="slide">
      <h1>Fixed Point Number System</h1>
      <p>32bit 안에서 정수부와 소수부를 나누어 표현합니다.</p>
      <p>하단의 중요한 PPT 내용이 자막에 가려지지 않아야 합니다.</p>
    </div>
    <div class="fake-controls"></div>
    <video></video>
  </div>
  <script>
    let contentListener = null;
    const settings = { overlayPosition:"bottom", overlaySize:"medium", overlayOpacity:0.8 };
    globalThis.chrome = {
      runtime: {
        onMessage: { addListener(listener) { contentListener = listener; } },
        async sendMessage() {
          return { ok:true, enabled:true, text:"고정 소수점에서는 정수부와 소수부를 함께 표현할 수 있습니다.", settings };
        }
      }
    };
    document.querySelectorAll("[data-position]").forEach(button => button.addEventListener("click", () => {
      settings.overlayPosition = button.dataset.position;
      contentListener?.({ type:"YTLT_OVERLAY_TEXT", enabled:true, text:"고정 소수점에서는 정수부와 소수부를 함께 표현할 수 있습니다. 다음 문장은 provisional 상태입니다.", settings }, null, () => {});
    }));
    document.getElementById("autohideBtn").addEventListener("click", () => {
      document.getElementById("movie_player").classList.toggle("ytp-autohide");
    });
  </script>
  <script src="../extension/content.js"></script>
</body>
</html>
