name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Python server
    # The server is used on Windows (start_server.bat, CUDA DLL loading), so test it there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            local-stt-server/requirements.txt
            local-stt-server/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r local-stt-server/requirements-dev.txt
      - name: Compile
        run: python -m py_compile local-stt-server/server.py local-stt-server/streaming.py local-stt-server/translator.py local-stt-server/cuda_runtime.py scripts/compare_modes.py scripts/smoke_websocket.py
      - name: Unit tests
        working-directory: local-stt-server
        run: python -m unittest discover -s tests -v

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for file in extension/*.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test extension/tests/transcript-utils.test.js
